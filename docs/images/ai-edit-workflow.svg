  <g class="code" font-size="16">
    <text x="23" y="133">1</text><text x="68" y="133">Optimus is Tesla's humanoid robot, designed to perform repetitive and dangerous tasks.</text>
    <text x="23" y="151">2</text><text x="68" y="151">Standing about five feet eight inches tall, it uses advanced AI, cameras, and actuators to walk, lift objects, and navigate environments.</text>
    <text x="23" y="169">3</text><text x="68" y="169">Tesla hopes Optimus transforms industry and home life, becoming one of the world's most widely produced robots.</text>
    <text x="23" y="187">4</text>
  </g>
